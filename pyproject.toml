[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flapro-genome"
version = "0.2.0"
description = "Genome-level annotation of bacterial flagellins using FlaPro references"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "FlaPro Genome contributors"}]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "biopython>=1.81",
  "pyyaml>=6.0",
  "tqdm>=4.65",
]

[project.scripts]
flapro-genome = "flapro_genome.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests requiring external command-line tools",
]
